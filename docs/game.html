<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#6366f1" />
  <title>ゲーム | お手伝いクエスト</title>
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
</head>
<body>
  <header class="app-header">
    <h1><span class="emoji">🎮</span>ゲーム</h1>
    <nav>
      <a href="./index.html">今日</a>
      <a href="./record.html">記録</a>
      <a href="./game.html" class="active">ゲーム</a>
      <a href="./parent.html">設定</a>
    </nav>
  </header>
  <main class="app-main">

    <div class="subtabs" id="subtabs">
      <button class="subtab active" data-tab="shooter"><span class="emoji">🚀</span>シューティング</button>
      <button class="subtab" data-tab="pet"><span class="emoji">🐾</span>ペット</button>
    </div>

    <div id="tab-shooter" class="game-tab">
      <section class="panel">
        <div class="coin-row">
          <div class="coin-badge"><span class="emoji">🪙</span><span id="shooter-coin">-</span></div>
          <div class="area-name">🏆 ハイスコア <span id="shooter-highscore">0</span></div>
        </div>
        <p class="level-sub">
          累計撃墜 <span id="shooter-kills">0</span>機 ・ プレイ <span id="shooter-plays">0</span>回
        </p>
      </section>

      <section class="panel">
        <div class="shooter-hud" id="shooter-hud" hidden>
          <div>スコア <span id="hud-score">0</span></div>
          <div id="hud-power">💥1</div>
          <div id="hud-lives">❤❤❤</div>
        </div>
        <div class="retro-frame">
          <canvas id="shooter-canvas" width="320" height="400"></canvas>
        </div>
        <p class="play-hint">画面を指でなぞると飛行機が動きます。弾は自動で出ます。<br>
          落ちてくるアイテムを取ると強くなる！（💥パワー ⚡連射 ❤️ライフ）</p>
        <p id="shooter-msg" class="level-sub"></p>
      </section>

      <section class="panel">
        <h2>出撃ブースト（払うほど強い）</h2>
        <div class="boost-list" id="boost-list"></div>
        <button class="btn" id="shooter-start-btn" style="width:100%; margin-top:12px">スタート</button>
      </section>

      <section class="panel">
        <h2>永続強化</h2>
        <div id="upgrade-list"></div>
      </section>
    </div>

    <div id="tab-pet" class="game-tab" hidden>
      <section class="panel" id="pet-picker-panel" hidden>
        <h2>育てる子を選ぶ</h2>
        <div id="pet-picker"></div>
      </section>

      <section class="panel" id="pet-care-panel" hidden>
        <div class="coin-row">
          <div class="coin-badge"><span class="emoji">🪙</span><span id="pet-coin-balance">-</span></div>
          <div class="area-name" id="pet-stage-name">-</div>
        </div>
        <p class="level-sub" id="pet-progress"></p>
        <div class="xpbar" id="pet-growth-bar"><span id="pet-growth-fill" style="width:0%"></span></div>
        <div class="retro-frame">
          <canvas id="pet-canvas" width="160" height="160"></canvas>
        </div>
        <p class="level-sub" id="pet-flavor"></p>
        <div class="field">
          <label>お腹</label>
          <div class="xpbar"><span id="pet-hunger-fill" style="width:0%"></span></div>
        </div>
        <div class="field">
          <label>仲良し度</label>
          <div class="xpbar"><span id="pet-happy-fill" style="width:0%"></span></div>
        </div>
        <div class="row">
          <button class="btn" id="pet-feed-btn">ごはん（🪙 <span id="pet-feed-cost">-</span>）</button>
          <button class="btn" id="pet-treat-btn">ごちそう（🪙 <span id="pet-treat-cost">-</span>）</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn secondary" id="pet-play-btn">遊ぶ</button>
          <button class="btn secondary" id="pet-clean-btn">掃除（🪙 <span id="pet-clean-cost">-</span>）</button>
        </div>
        <p id="pet-msg" class="level-sub"></p>
        <button class="btn secondary" id="pet-graduate-btn" style="width:100%; margin-top:8px" hidden>卒業させる</button>
      </section>

      <section class="panel">
        <h2>図鑑</h2>
        <div id="pet-album"></div>
      </section>
    </div>
  </main>

  <div class="modal-back" id="modal" hidden>
    <div class="modal">
      <div class="big-emoji" id="modal-emoji">🎉</div>
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <button id="modal-ok">OK</button>
    </div>
  </div>

  <script type="module" src="./js/shooter.js"></script>
  <script type="module" src="./js/pet.js"></script>
  <script type="module" src="./js/game-tabs.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
